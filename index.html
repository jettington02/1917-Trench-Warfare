<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WW1 Trench FPS – Kar98k</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a1a; font-family: 'Courier New', monospace; touch-action: none; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; color: #e0d8b0;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border: 2px solid #e0d8b0; border-radius: 50%; opacity: 0.7;
    }
    #hud {
      position: absolute; bottom: 18px; left: 18px;
      font-size: 17px; text-shadow: 2px 2px 0 #000; line-height: 1.45;
    }
    #message {
      position: absolute; top: 32%; width: 100%; text-align: center;
      font-size: 26px; text-shadow: 3px 3px 0 #000; display: none;
    }
    #start-screen {
      position: absolute; inset: 0; background: rgba(15,12,8,0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #e0d8b0; z-index: 20; pointer-events: auto;
    }
    #start-screen h1 { font-size: 32px; margin-bottom: 14px; letter-spacing: 2px; text-align: center; }
    #start-screen p { font-size: 15px; margin: 6px 0; opacity: 0.9; text-align: center; padding: 0 20px; }
    #start-btn {
      margin-top: 28px; padding: 16px 48px; font-size: 20px;
      background: #5a4a30; color: #e0d8b0; border: 2px solid #c8b890;
      border-radius: 8px; cursor: pointer; font-family: inherit;
      pointer-events: auto;
    }
    #start-btn:active { background: #7a6a40; }
    .hint { margin-top: 18px; font-size: 13px; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="hud">
      HEALTH: <span id="health">100</span><br>
      AMMO: <span id="ammo">5</span> / 5<br>
      SCORE: <span id="score">0</span><br>
      WAVE: <span id="wave">1</span>
    </div>
    <div id="message"></div>
  </div>

  <div id="start-screen">
    <h1>TRENCH WARFARE 1917</h1>
    <p>WASD = Move</p>
    <p>Arrow Keys or IJKL = Look around</p>
    <p>R = Reload &nbsp;|&nbsp; Tap / Click = Shoot</p>
    <button id="start-btn">START GAME</button>
    <p class="hint">Works best with Bluetooth keyboard</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, clock;
    let player = { health: 100, ammo: 5, maxAmmo: 5, score: 0, wave: 1, alive: true };
    let enemies = [];
    let keys = {};
    let canShoot = true;
    let reloading = false;
    let gameStarted = false;
    let enemySpawnTimer = 0;
    let lastHitTime = 0;
    let gunGroup;
    let gunBasePos = new THREE.Vector3(0.32, -0.28, -0.62);
    let gunRecoil = 0;
    let time = 0;
    let lookSpeed = 1.8; // keyboard look speed

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x3a3528);
      scene.fog = new THREE.Fog(0x3a3528, 20, 90);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 200);
      camera.position.set(0, 1.7, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      scene.add(new THREE.AmbientLight(0x7a6b52, 0.7));
      const dir = new THREE.DirectionalLight(0xd0c090, 1.0);
      dir.position.set(20, 40, 15);
      scene.add(dir);

      // Ground
      const gGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
      const pos = gGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setZ(i, (Math.random()-0.5)*0.6);
      gGeo.computeVertexNormals();
      const ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({ color: 0x4a3f2f, roughness: 1 }));
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      createTrenches();
      createKar98k();

      // Input
      document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
      document.addEventListener('keyup',   e => { keys[e.code] = false; });
      document.addEventListener('mousedown', tryShoot);
      document.addEventListener('touchstart', tryShoot, {passive: false});

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('start-btn').addEventListener('touchend', (e) => {
        e.preventDefault();
        startGame();
      });

      animate();
    }

    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      gameStarted = true;
      player.health = 100;
      player.ammo = 5;
      player.score = 0;
      player.wave = 1;
      player.alive = true;
      enemies.forEach(e => scene.remove(e.mesh));
      enemies = [];
      updateHUD();
      hideMessage();
      showMessage('GO!', 1000);
    }

    function tryShoot(e) {
      if (!gameStarted) return;
      if (e.type === 'touchstart') e.preventDefault();
      shoot();
    }

    // ========== KAR98k + HANDS ==========
    function createKar98k() {
      gunGroup = new THREE.Group();
      camera.add(gunGroup);
      gunGroup.position.copy(gunBasePos);
      gunGroup.rotation.set(0.12, 0.15, 0.06);
      gunGroup.scale.set(1.15, 1.15, 1.15);

      const wood  = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 });
      const metal = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.65, roughness: 0.3 });
      const darkM = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5, roughness: 0.4 });
      const glove = new THREE.MeshStandardMaterial({ color: 0x5a6b3a, roughness: 0.85 });

      // Stock
      gunGroup.add(makeBox(0.11, 0.14, 0.58, wood, 0, -0.03, 0.2));
      // Receiver
      gunGroup.add(makeBox(0.09, 0.11, 0.3, metal, 0, 0.03, -0.1));
      // Barrel
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.022, 0.78, 8), darkM);
      barrel.rotation.x = Math.PI/2;
      barrel.position.set(0, 0.04, -0.58);
      gunGroup.add(barrel);
      // Muzzle
      const muz = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.025, 0.07, 8), metal);
      muz.rotation.x = Math.PI/2;
      muz.position.set(0, 0.04, -0.98);
      gunGroup.add(muz);
      // Bolt
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.13, 6), metal);
      bolt.rotation.z = Math.PI/2;
      bolt.position.set(0.07, 0.05, -0.02);
      gunGroup.add(bolt);
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.08, 6), metal);
      handle.rotation.x = Math.PI/2;
      handle.position.set(0.12, 0.05, -0.02);
      gunGroup.add(handle);
      // Sights
      gunGroup.add(makeBox(0.045, 0.035, 0.025, darkM, 0, 0.09, 0.0));
      gunGroup.add(makeBox(0.018, 0.04, 0.012, darkM, 0, 0.08, -0.9));

      // Right hand + arm
      const rHand = new THREE.Group();
      const palmR = makeBox(0.1, 0.055, 0.13, glove, 0.13, -0.09, 0.05);
      palmR.rotation.set(0.35, -0.45, 0.25);
      rHand.add(palmR);
      for (let i=0;i<4;i++) {
        const f = makeBox(0.024, 0.028, 0.075, glove, 0.1+i*0.028, -0.1, -0.05);
        f.rotation.x = 0.55;
        rHand.add(f);
      }
      const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.38, 8), glove);
      rArm.rotation.z = Math.PI/2.1;
      rArm.rotation.y = -0.35;
      rArm.position.set(0.32, -0.18, 0.28);
      rHand.add(rArm);
      gunGroup.add(rHand);

      // Left hand + arm
      const lHand = new THREE.Group();
      const palmL = makeBox(0.11, 0.055, 0.12, glove, -0.09, -0.07, -0.38);
      palmL.rotation.set(0.45, 0.55, -0.35);
      lHand.add(palmL);
      for (let i=0;i<4;i++) {
        const f = makeBox(0.024, 0.028, 0.07, glove, -0.13+i*0.03, -0.08, -0.46);
        f.rotation.x = 0.65;
        lHand.add(f);
      }
      const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.42, 8), glove);
      lArm.rotation.z = -Math.PI/2.3;
      lArm.rotation.y = 0.45;
      lArm.position.set(-0.3, -0.14, -0.12);
      lHand.add(lArm);
      gunGroup.add(lHand);
    }

    function makeBox(w,h,d, mat, x,y,z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
      m.position.set(x,y,z);
      return m;
    }

    function createTrenches() {
      const mat = new THREE.MeshStandardMaterial({ color: 0x3d3428 });
      for (let i=-4;i<=4;i++) {
        if (i===0) continue;
        const w = new THREE.Mesh(new THREE.BoxGeometry(4,2.2,80), mat);
        w.position.set(i*8, 1.1, 0);
        scene.add(w);
      }
      for (let i=0;i<30;i++) {
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(1.5+Math.random(),0.7,1+Math.random()),
          new THREE.MeshStandardMaterial({ color: 0x5c4e3a })
        );
        b.position.set((Math.random()-0.5)*70, 0.35, (Math.random()-0.5)*80);
        scene.add(b);
      }
    }

    function shoot() {
      if (!player.alive || !canShoot || reloading || player.ammo <= 0) {
        if (player.ammo <= 0 && !reloading) reload();
        return;
      }
      player.ammo--;
      canShoot = false;
      setTimeout(() => canShoot = true, 780);
      gunRecoil = 0.11;

      const flash = new THREE.PointLight(0xffaa33, 5, 7);
      flash.position.set(0, 0.05, -1.05);
      gunGroup.add(flash);
      setTimeout(() => gunGroup.remove(flash), 45);

      updateHUD();

      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2(0,0), camera);
      const hits = ray.intersectObjects(enemies.map(e => e.mesh));
      if (hits.length) {
        const e = enemies.find(en => en.mesh === hits[0].object);
        if (e) {
          e.health -= 55;
          e.mesh.material.color.setHex(0xcc3333);
          setTimeout(() => { if (e.mesh) e.mesh.material.color.setHex(0x4a5a3a); }, 80);
          if (e.health <= 0) {
            scene.remove(e.mesh);
            enemies = enemies.filter(x => x !== e);
            player.score += 100;
            updateHUD();
            checkWave();
          }
        }
      }
    }

    function reload() {
      if (reloading || player.ammo === player.maxAmmo) return;
      reloading = true;
      showMessage('RELOADING…', 0);
      gunGroup.rotation.x = 0.35;
      setTimeout(() => {
        gunGroup.rotation.x = 0.12;
        player.ammo = player.maxAmmo;
        reloading = false;
        updateHUD();
        hideMessage();
      }, 2100);
    }

    function spawnEnemy() {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.7,1.6,0.5),
        new THREE.MeshStandardMaterial({ color: 0x4a5a3a })
      );
      const ang = (Math.random()-0.5)*Math.PI*0.9;
      const dist = 40 + Math.random()*20;
      mesh.position.set(Math.sin(ang)*dist, 0.8, -Math.cos(ang)*dist + camera.position.z);
      const helm = new THREE.Mesh(new THREE.SphereGeometry(0.28,8,6), new THREE.MeshStandardMaterial({color:0x333333}));
      helm.position.y = 0.95;
      mesh.add(helm);
      scene.add(mesh);
      enemies.push({ mesh, health: 100, speed: 2.1 + Math.random()*1.0 + player.wave*0.15 });
    }

    function updateEnemies(dt) {
      for (let i = enemies.length-1; i >= 0; i--) {
        const e = enemies[i];
        const dir = new THREE.Vector3().subVectors(camera.position, e.mesh.position).setY(0).normalize();
        e.mesh.position.add(dir.multiplyScalar(e.speed * dt));
        e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
        if (e.mesh.position.distanceTo(camera.position) < 2.4 && player.alive) {
          if (performance.now() - lastHitTime > 600) {
            player.health -= 15;
            lastHitTime = performance.now();
            updateHUD();
            if (player.health <= 0) {
              player.alive = false;
              showMessage('YOU DIED — Tap START to restart', 0);
              document.getElementById('start-screen').style.display = 'flex';
              document.getElementById('start-btn').textContent = 'RESTART';
            }
          }
        }
      }
    }

    function checkWave() {
      if (enemies.length === 0) {
        player.wave++;
        updateHUD();
        showMessage('WAVE ' + player.wave, 1300);
        for (let i = 0; i < 3 + Math.floor(player.wave*1.4); i++) {
          setTimeout(spawnEnemy, i*400);
        }
      }
    }

    function updatePlayer(dt) {
      if (!player.alive || !gameStarted) return;

      // Keyboard look (Arrow keys + IJKL)
      if (keys['ArrowLeft']  || keys['KeyJ']) camera.rotation.y += lookSpeed * dt;
      if (keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= lookSpeed * dt;
      if (keys['ArrowUp']    || keys['KeyI']) camera.rotation.x += lookSpeed * dt;
      if (keys['ArrowDown']  || keys['KeyK']) camera.rotation.x -= lookSpeed * dt;
      camera.rotation.x = Math.max(-1.25, Math.min(1.25, camera.rotation.x));

      // Movement
      const speed = 6.5;
      const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      forward.y = 0; forward.normalize();
      const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
      right.y = 0; right.normalize();

      const move = new THREE.Vector3();
      if (keys['KeyW']) move.add(forward);
      if (keys['KeyS']) move.sub(forward);
      if (keys['KeyA']) move.sub(right);
      if (keys['KeyD']) move.add(right);

      if (move.length() > 0) {
        move.normalize().multiplyScalar(speed * dt);
        camera.position.add(move);
      }
      camera.position.y = 1.7;
      camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
      camera.position.z = Math.max(-75, Math.min(35, camera.position.z));

      if (keys['KeyR']) reload();

      // Recoil + sway
      time += dt;
      if (gunRecoil > 0) {
        gunRecoil *= 0.82;
        gunGroup.position.z = gunBasePos.z + gunRecoil;
        gunGroup.position.y = gunBasePos.y + gunRecoil * 0.45;
        if (gunRecoil < 0.003) gunRecoil = 0;
      } else {
        gunGroup.position.x = gunBasePos.x + Math.sin(time * 1.8) * 0.008;
        gunGroup.position.y = gunBasePos.y + Math.sin(time * 2.1) * 0.006;
        gunGroup.position.z = gunBasePos.z;
      }
    }

    function updateHUD() {
      document.getElementById('health').textContent = Math.max(0, Math.floor(player.health));
      document.getElementById('ammo').textContent = player.ammo;
      document.getElementById('score').textContent = player.score;
      document.getElementById('wave').textContent = player.wave;
    }
    function showMessage(t, duration) {
      const el = document.getElementById('message');
      el.textContent = t;
      el.style.display = 'block';
      if (duration > 0) setTimeout(hideMessage, duration);
    }
    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (gameStarted && player.alive) {
        updatePlayer(dt);
        updateEnemies(dt);
        enemySpawnTimer += dt;
        if (enemySpawnTimer > 4.0 - Math.min(player.wave*0.2, 2.0) && enemies.length < 12) {
          spawnEnemy();
          enemySpawnTimer = 0;
        }
      }
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
